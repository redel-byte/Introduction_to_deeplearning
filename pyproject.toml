[project]
name = "introduction-to-deeplearning"
version = "0.1.0"
description = "A beginner-friendly CNN project for four-class brain MRI classification"
readme = "README.md"
authors = [
    { name = "redel-byte", email = "ridouanelhabib1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.20,<2.22",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
    "ipykernel>=6.29",
    "pydot>=3.0",
]

[project.scripts]
introduction-to-deeplearning = "introduction_to_deeplearning:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
